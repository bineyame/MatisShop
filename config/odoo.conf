[options]
; ---------------------------------------------------------------------------
; Odoo 18 Community - local development configuration
; Odoo core is never modified; all custom code is loaded from /mnt/extra-addons
; ---------------------------------------------------------------------------
addons_path = /opt/odoo/source/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Database manager master password (development value, see .env)
admin_passwd = admin_master_dev

; Only expose the demo database; prevents accidental multi-db confusion.
dbfilter = ^odoo$
list_db = True

http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
proxy_mode = False

; Multi-worker is deliberately off: single-process makes `odoo-bin shell`,
; breakpoints and deterministic demo verification far easier locally.
workers = 0
max_cron_threads = 2

limit_time_cpu = 600
limit_time_real = 1200

log_level = info
logfile = None

without_demo = all
